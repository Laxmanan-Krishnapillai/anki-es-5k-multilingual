subtlex:
  # Path to the raw SUBTLEX‑ES dataset.  This file should contain
  # at least the following columns: lemma (or word), part‑of‑speech (pos),
  # rank (1–N) and Zipf frequency.  The script will attempt to auto‑detect
  # column names if they differ slightly (e.g. `Lemma`, `Word`, etc.).
  filepath: data_raw/subtlex_es/subtlex_es.tsv
  # Delimiter used in the raw SUBTLEX dataset.  The standard SUBTLEX
  # release uses a tab delimiter.  Override if your file uses a different
  # delimiter (e.g. "," for CSV).
  delimiter: "\t"
  # How many lemmas to keep.  M1 freezes the top 5,000 lemmas by rank.
  top_n: 5000

# Settings for Wiktionary parsing (Phase M2)
wiktionary:
  # Path to the Spanish Wiktionary dump in JSON or JSON Lines format.  A
  # file produced by wiktextract is recommended.  Use .bz2 or .gz
  # extension if the file is compressed.
  dump_path: data_raw/wiktionary_dump/es-extract.jsonl.gz
  # Output TSV containing es_norm → IPA entries
  ipa_tsv: data_intermediate/02_ipa.tsv
  # Output TSV containing revision metadata (es_norm → page_id, revision_id, timestamp)
  meta_tsv: data_intermediate/02_wikt_meta.tsv
  # Path to the lemma list generated in M1
  lemma_tsv: data_intermediate/01_lemmas.tsv
